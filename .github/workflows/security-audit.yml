name: Security Audit

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Cargo Audit & Outdated
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Run cargo audit
        id: cargo-audit
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = cargo audit --json 2>&1 | Out-String
          $exitCode = $LASTEXITCODE

          # Always write raw output for the report step
          Set-Content -Path "$env:RUNNER_TEMP/audit-output.txt" -Value $output

          if ($exitCode -ne 0) {
            Write-Output "audit_failed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "audit_failed=false" >> $env:GITHUB_OUTPUT
          }
          # Do not fail the step — the create-issue step handles reporting
          exit 0

      - name: Run cargo outdated
        id: cargo-outdated
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = cargo outdated --exit-code 0 2>&1 | Out-String
          Set-Content -Path "$env:RUNNER_TEMP/outdated-output.txt" -Value $output

          if ($output -match "^\S" -and $output -notmatch "^All dependencies") {
            Write-Output "outdated_found=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "outdated_found=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build audit report
        id: build-report
        shell: pwsh
        run: |
          $date   = Get-Date -Format "yyyy-MM-dd"
          $audit  = Get-Content "$env:RUNNER_TEMP/audit-output.txt" -Raw -ErrorAction SilentlyContinue
          $outdated = Get-Content "$env:RUNNER_TEMP/outdated-output.txt" -Raw -ErrorAction SilentlyContinue

          $report = @"
          ## Security Audit Report — $date

          ### cargo audit

          ``````
          $audit
          ``````

          ### cargo outdated

          ``````
          $outdated
          ``````

          ---
          *Generated by the [security-audit workflow](../actions/workflows/security-audit.yml)*
          "@

          # Write to file for the issue creation step
          Set-Content -Path "$env:RUNNER_TEMP/report.md" -Value $report

      - name: Create or update GitHub issue if findings exist
        if: steps.cargo-audit.outputs.audit_failed == 'true' || steps.cargo-outdated.outputs.outdated_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.RUNNER_TEMP + '/report.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            const title = `[Security] Audit findings — ${date}`;

            // Check for an existing open audit issue this week
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated-audit',
            });

            const existingIssue = issues.find(i => i.title.startsWith('[Security] Audit findings'));

            if (existingIssue) {
              // Update the existing issue with a new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: report,
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Open a new issue
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: report,
                labels: ['security', 'automated-audit'],
              });
              console.log(`Created new issue #${newIssue.number}`);
            }
